services:
  whisper-server:
    image: ghcr.io/paolino/whisper-server:latest
    container_name: whisper-server
    restart: unless-stopped
    network_mode: host
    environment:
      - WHISPER_HOST=${WHISPER_HOST}  # Set to Tailscale IP for secure remote access
      - WHISPER_PORT=${WHISPER_PORT:-9002}
      - WHISPER_HTTP_PORT=${WHISPER_HTTP_PORT:-9003}
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-auto}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-auto}
      # WHISPER_LANGUAGE - set to language code (e.g., en, it) or omit for auto-detect
      # LLama post-processing (optional)
      - WHISPER_LLAMA_ENABLED=${WHISPER_LLAMA_ENABLED:-false}
      - WHISPER_LLAMA_MODEL_PATH=${WHISPER_LLAMA_MODEL_PATH:-/models/llama.gguf}
      - WHISPER_LLAMA_CONTEXT_SIZE=${WHISPER_LLAMA_CONTEXT_SIZE:-2048}
      - WHISPER_LLAMA_MAX_TOKENS=${WHISPER_LLAMA_MAX_TOKENS:-512}
      - WHISPER_LLAMA_THREADS=${WHISPER_LLAMA_THREADS:-4}
    volumes:
      - whisper-cache:/tmp/pip-packages
      - huggingface-cache:/tmp/.cache
      - ${LLAMA_MODEL_DIR:-./models}:/models:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('localhost',9002)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  whisper-cache:
  huggingface-cache:
