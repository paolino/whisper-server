name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.2.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (skip actual release)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version format: $VERSION"
            echo "Expected format: MAJOR.MINOR.PATCH (e.g., 1.2.0)"
            exit 1
          fi
          echo "Version format valid: $VERSION"

      - name: Check tag doesn't exist
        run: |
          VERSION="${{ inputs.version }}"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists!"
            exit 1
          fi
          echo "Tag v$VERSION is available"

  test:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: paolino/dev-assets/setup-nix@v0.0.1
        with:
          cachix-auth-token: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Format check
        run: |
          nix develop --quiet -c black --check src
          nix develop --quiet -c ruff check src

      - name: Type check
        run: nix develop --quiet -c mypy src

      - name: Run tests
        run: nix develop --quiet -c pytest src -v

      - name: Build Docker image
        run: nix build .#docker-image --quiet

  release:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ !inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: paolino/dev-assets/setup-nix@v0.0.1
        with:
          cachix-auth-token: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set version and build Docker image
        run: |
          echo "${{ inputs.version }}" > VERSION
          nix build .#docker-image
          docker load < result

      - name: Create and push tag
        run: |
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          VERSION="${{ inputs.version }}"
          docker push "ghcr.io/paolino/whisper-server:$VERSION"
          docker tag "ghcr.io/paolino/whisper-server:$VERSION" \
            "ghcr.io/paolino/whisper-server:latest"
          docker push "ghcr.io/paolino/whisper-server:latest"

      - name: Generate release notes
        id: notes
        run: |
          # Find previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi

          # Generate categorized notes
          {
            echo "## What's Changed"
            echo ""

            # Features
            FEATS=$(git log --oneline "$RANGE" --grep="^feat" --pretty=format:"- %s" 2>/dev/null || true)
            if [ -n "$FEATS" ]; then
              echo "### Features"
              echo "$FEATS"
              echo ""
            fi

            # Fixes
            FIXES=$(git log --oneline "$RANGE" --grep="^fix" --pretty=format:"- %s" 2>/dev/null || true)
            if [ -n "$FIXES" ]; then
              echo "### Bug Fixes"
              echo "$FIXES"
              echo ""
            fi

            # Docs
            DOCS=$(git log --oneline "$RANGE" --grep="^docs" --pretty=format:"- %s" 2>/dev/null || true)
            if [ -n "$DOCS" ]; then
              echo "### Documentation"
              echo "$DOCS"
              echo ""
            fi

            # CI/Chore
            OTHER=$(git log --oneline "$RANGE" --grep="^ci\|^chore\|^style\|^refactor\|^test" --pretty=format:"- %s" 2>/dev/null || true)
            if [ -n "$OTHER" ]; then
              echo "### Other"
              echo "$OTHER"
              echo ""
            fi

            echo "---"
            echo "**Docker:** [\`ghcr.io/paolino/whisper-server:${{ inputs.version }}\`](https://github.com/paolino/whisper-server/pkgs/container/whisper-server)"
          } > release-notes.md

          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --notes-file release-notes.md

  dry-run-summary:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - uses: paolino/dev-assets/setup-nix@v0.0.1
        with:
          cachix-auth-token: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Verify image tag
        run: |
          echo "${{ inputs.version }}" > VERSION
          nix build .#docker-image
          docker load < result

          EXPECTED="ghcr.io/paolino/whisper-server:${{ inputs.version }}"
          if docker image inspect "$EXPECTED" > /dev/null 2>&1; then
            echo "Image tagged correctly: $EXPECTED"
          else
            echo "ERROR: Expected image tag $EXPECTED not found"
            echo "Available images:"
            docker images | grep whisper-server
            exit 1
          fi

      - name: Dry run summary
        run: |
          echo "Dry run completed successfully!"
          echo ""
          echo "Would have:"
          echo "  - Updated VERSION to ${{ inputs.version }}"
          echo "  - Created tag v${{ inputs.version }}"
          echo "  - Pushed ghcr.io/paolino/whisper-server:${{ inputs.version }}"
          echo "  - Pushed ghcr.io/paolino/whisper-server:latest"
          echo "  - Created GitHub Release v${{ inputs.version }}"
