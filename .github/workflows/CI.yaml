name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: paolino/dev-assets/setup-nix@v0.0.1
        with:
          cachix-auth-token: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Format check
        run: |
          nix develop --quiet -c black --check src
          nix develop --quiet -c ruff check src

      - name: Type check
        run: nix develop --quiet -c mypy src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: paolino/dev-assets/setup-nix@v0.0.1
        with:
          cachix-auth-token: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Run tests
        run: nix develop --quiet -c pytest src -v

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: paolino/dev-assets/setup-nix@v0.0.1
        with:
          cachix-auth-token: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build Docker image
        run: nix build .#docker-image --quiet

  smoke-test:
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
      - uses: actions/checkout@v4

      - uses: paolino/dev-assets/setup-nix@v0.0.1
        with:
          cachix-auth-token: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build and load Docker image
        run: |
          nix build .#docker-image
          docker load < result

      - name: Start container
        run: |
          version=$(nix eval --raw ".#version.x86_64-linux")
          docker run -d --name whisper-smoke -p 9003:9002 \
            "ghcr.io/paolino/whisper-server:$version"

      - name: Wait for server
        run: sleep 30

      - name: Run smoke test
        run: nix develop --quiet --command python3 scripts/smoke-test.py 9003

      - name: Cleanup
        if: always()
        run: docker rm -f whisper-smoke || true
